<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thanh Toán Thất Bại | Thảnh Thơi Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { pink: 'hsl(158, 48%, 53%)', 'pink-light': 'hsl(158, 48%, 95%)' }, fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-10 rounded-3xl shadow-lg max-w-md w-full text-center">
    <div class="w-24 h-24 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="x-circle" class="w-12 h-12"></i></div>
    <h1 class="font-display text-3xl font-bold text-gray-800 mb-2">Thanh Toán Đã Hủy!</h1>
    <p class="text-gray-500 mb-6">Giao dịch của bạn không thành công hoặc đã bị hủy bỏ.</p>
    <div class="bg-gray-50 rounded-xl p-4 mb-8 text-left text-sm text-gray-600">
      <p class="mb-1">Mã đơn hàng: <strong id="order-id" class="text-pink">...</strong></p>
      <p>Trạng thái: <strong class="text-red-500">Chưa thanh toán</strong></p>
    </div>
    <div class="flex gap-4">
      <a href="checkout.html" class="flex-1 border border-gray-300 text-gray-600 font-bold py-3 rounded-full hover:bg-gray-50 transition-colors">Thử Lại</a>
      <a href="index.html" class="flex-1 bg-pink text-white font-bold py-3 rounded-full hover:bg-rose-400 transition-colors">Về Trang Chủ</a>
    </div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    if (orderId) {
      document.getElementById('order-id').innerText = '#' + orderId.padStart(6, '0');
    }
  </script>
</body>
</html>
