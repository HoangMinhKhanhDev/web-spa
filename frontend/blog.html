<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Kiến Thức – Thảnh Thơi Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: 'hsl(158, 39%, 52%)',
            sage: 'hsl(158, 25%, 18%)',
            gold: 'hsl(45, 35%, 60%)',
            cream: 'hsl(45, 40%, 97%)',
          },
          fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
        },
      },
    };
  </script>
</head>
<body class="bg-cream/30 min-h-screen flex flex-col">

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/_shared.js"></script>
<script>
  async function init() {
    renderHeader('blog.html');
    await loadBlogs();
    renderFooter();
  }

  async function loadBlogs() {
    try {
      const posts = await api.get('/blog');
      renderPosts(posts);
    } catch (err) {
      Toast.error('Không thể tải bài viết');
    }
  }

  function renderPosts(posts) {
    const grid = document.getElementById('blog-grid');
    if (!posts.length) {
      grid.innerHTML = '<div class="col-span-full py-40 text-center italic text-sage/40">Chưa có bài viết nào...</div>';
    } else {
      grid.innerHTML = posts.map(p => `
        <article class="bg-white rounded-[32px] lg:rounded-[48px] overflow-hidden shadow-soft border border-sage/5 group hover:border-gold transition-all duration-700">
          <div class="aspect-[16/10] overflow-hidden relative">
            <img src="${p.imageUrl || 'assets/hero_lifestyle_premium_1773483645776.png'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
          </div>
          <div class="p-6 lg:p-10">
            <p class="text-[9px] lg:text-[10px] font-bold uppercase tracking-[0.3em] text-gold mb-4">${p.tags || 'Kiến thức'}</p>
            <h3 class="font-serif text-2xl lg:text-3xl italic text-sage mb-4 lg:mb-6 leading-tight group-hover:text-mint transition-colors">${p.title}</h3>
            <p class="text-sage/60 text-xs lg:text-sm font-light line-clamp-3 mb-6 lg:mb-8">${p.summary || ''}</p>
            <a href="blog-detail.html?slug=${p.slug}" class="inline-flex items-center gap-3 text-[9px] lg:text-[10px] font-bold uppercase tracking-widest text-sage border-b border-sage/20 hover:border-mint hover:text-mint transition-all pb-2">ĐỌC TIẾP <i data-lucide="arrow-right" class="w-3 h-3"></i></a>
          </div>
        </article>
      `).join('');
    }
    if (window.lucide) lucide.createIcons();
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

<main class="flex-grow pt-24 lg:pt-32 pb-24 lg:pb-40">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-16 lg:mb-24">
      <p class="text-[9px] lg:text-[11px] font-bold uppercase tracking-[0.5em] text-gold mb-6 lg:mb-8">Green Knowledge</p>
      <h1 class="font-serif text-4xl lg:text-6xl text-sage italic mb-6 lg:mb-8">Góc <span class="italic text-mint italic-serif">Chia Sẻ.</span></h1>
      <p class="text-sage/50 font-light text-sm lg:text-base">Nơi chúng mình chia sẻ những kiến thức về thảo mộc bản địa và hành trình chăm sóc vẻ đẹp thuần khiết.</p>
    </div>

    <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-12">
      <!-- Loading posts... -->
    </div>
  </div>
</main>

</body>
</html>
