<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thanh Toán Thành Công | Thảnh Thơi Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { pink: 'hsl(158, 48%, 53%)', 'pink-light': 'hsl(158, 48%, 95%)' }, fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-10 rounded-3xl shadow-lg max-w-md w-full text-center">
    <div class="w-24 h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="check-circle" class="w-12 h-12"></i></div>
    <h1 class="font-display text-3xl font-bold text-gray-800 mb-2">Thanh Toán Thành Công!</h1>
    <p class="text-gray-500 mb-6" id="order-msg">Cảm ơn bạn đã tin tưởng Thảnh Thơi Farm.</p>
    <div class="bg-gray-50 rounded-xl p-4 mb-8 text-left text-sm text-gray-600">
      <p class="mb-1">Mã đơn hàng: <strong id="order-id" class="text-pink">Đang tải...</strong></p>
      <p>Trạng thái: <strong class="text-green-600">Đã thanh toán</strong></p>
    </div>
    <a href="index.html" class="block w-full bg-pink text-white font-bold py-3 rounded-full hover:bg-rose-400 transition-colors">Tiếp Tục Mua Sắm</a>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    if (orderId) {
      document.getElementById('order-id').innerText = '#' + orderId.padStart(6, '0');
      document.getElementById('order-msg').innerText = 'Đơn hàng của bạn đang được chuẩn bị và sẽ sớm giao đến tay bạn.';
      
      // If Stripe redirect directly to here without webhook, we can tell backend to verify:
      fetch('/api/checkout/verify', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        },
        body: JSON.stringify({ orderId: orderId })
      }).catch(e => console.error(e));
    }
  </script>
</body>
</html>
