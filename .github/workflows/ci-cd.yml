name: Thảnh Thơi Farm CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: |
        cd backend
        npm install

    - name: Prisma Generate
      run: |
        cd backend
        npx prisma generate

    # - name: Run Tests
    #   run: |
    #     cd backend
    #     npm test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t thanhthoi-farm-app:latest -f backend/Dockerfile .

