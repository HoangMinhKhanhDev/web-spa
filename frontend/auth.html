<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập / Đăng Ký – Thảnh Thơi Farm</title>
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Thảnh Thơi Farm" />
  <meta property="og:title" content="Tài Khoản – Thảnh Thơi Farm" />
  <meta property="og:description" content="Đăng nhập hoặc tạo tài khoản để mua sắm mỹ phẩm thiên nhiên hữu cơ dễ dàng hơn." />
  <meta property="og:image" content="assets/hero_lifestyle_premium_1773483645776.png" />
  <meta name="twitter:card" content="summary" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: { DEFAULT: 'hsl(158, 39%, 52%)', dark: 'hsl(158, 39%, 38%)', light: 'hsl(158, 39%, 96%)' },
            sage: { DEFAULT: 'hsl(158, 25%, 18%)', dark: 'hsl(158, 25%, 12%)', light: 'hsl(158, 20%, 95%)' },
            gold: { DEFAULT: 'hsl(45, 35%, 60%)', light: 'hsl(45, 35%, 85%)' },
            ink: { DEFAULT: 'hsl(158, 25%, 12%)', light: 'hsl(0, 0%, 45%)' },
            cream: 'hsl(45, 40%, 97%)',
            canvas: 'hsl(45, 40%, 97%)',
          },
          fontFamily: { 
            sans: ['Outfit', 'sans-serif'], 
            serif: ['Playfair Display', 'serif'] 
          },
        },
      },
    };
  </script>
  <style>
    body { background-color: var(--clr-canvas); min-height: 100vh; overflow-x: hidden; }
    .glass-premium { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 40px 100px -20px rgba(0,0,0,0.08); }
    
    .input-premium { width: 100%; padding: 18px 24px; border-radius: 16px; font-size: 14px; outline: none; transition: all 0.4s; background: white; border: 1.5px solid rgba(0,0,0,0.03); }
    .input-premium:focus { border-color: var(--clr-gold); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05); }
    
    .input-error { border-bottom: 2.5px solid #ef4444 !important; background: #fff5f5; }
    
    .tab-active-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--clr-mint); transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
  </style>
</head>
<body class="flex flex-col antialiased">

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/_shared.js"></script>
<script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('panel-login').classList.toggle('hidden', !isLogin);
      document.getElementById('panel-signup').classList.toggle('hidden', isLogin);
      
      const btnL = document.getElementById('tab-login-btn');
      const btnS = document.getElementById('tab-signup-btn');
      btnL.className = `relative py-5 text-[11px] uppercase tracking-[0.3em] font-bold transition-all ${isLogin ? 'text-ink' : 'text-gray-300'}`;
      btnS.className = `relative py-5 text-[11px] uppercase tracking-[0.3em] font-bold transition-all ${!isLogin ? 'text-ink' : 'text-gray-300'}`;
      
      document.getElementById('active-line').style.transform = isLogin ? 'translateX(0)' : 'translateX(calc(100% + 48px))';
    }

    function setError(id, msg) {
        const inp = document.getElementById(id);
        const errTag = document.getElementById(id + '-error');
        inp.classList.add('input-error');
        if(errTag) {
            errTag.textContent = msg;
            errTag.classList.remove('hidden');
        }
    }

    function clearErrors() {
        document.querySelectorAll('.input-premium').forEach(i => i.classList.remove('input-error'));
        document.querySelectorAll('.error-msg').forEach(e => e.classList.add('hidden'));
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearErrors();
      const btn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('login-email').value;
      const pw = document.getElementById('login-pw').value;

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>'; 
      if(window.lucide) lucide.createIcons();

      try {
        const data = await api.post('/auth/login', { email, password: pw });
        if (data.user) {
          Auth.save(data.user);
          Toast.success('Đăng nhập thành công! Đang chuyển hướng...');
          setTimeout(() => location.href = 'index.html', 1000);
        }
      } catch (err) {
        Toast.error(err?.error || 'Đăng nhập thất bại. Vui lòng kiểm tra lại.');
        setError('login-email', err?.error || 'Thông tin không chính xác');
      } finally {
        btn.disabled = false;
        btn.textContent = 'ĐĂNG NHẬP NGAY';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      clearErrors();
      const btn = e.target.querySelector('button[type="submit"]');
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pw = document.getElementById('reg-pw').value;

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
      if(window.lucide) lucide.createIcons();

      try {
        const data = await api.post('/auth/register', { name, email, password: pw });
        Auth.save(data.user);
        Toast.success('Chào mừng bạn đến với Thảnh Thơi Farm!');
        setTimeout(() => location.href = 'index.html', 1500);
      } catch (err) {
        Toast.error(err?.error || 'Đăng ký thất bại.');
        setError('reg-email', err?.error || 'Email đã tồn tại');
      } finally {
        btn.disabled = false;
        btn.textContent = 'BẮT ĐẦU HÀNH TRÌNH';
      }
    }


    function togglePw(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
</script>

<header class="p-10 flex justify-between items-center relative z-20">
    <a href="index.html" class="font-serif text-3xl font-bold italic tracking-tighter">Thảnh Thơi <span class="text-rose not-italic">Farm.</span></a>
    <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-rose transition-all flex items-center gap-3">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Cửa hàng
    </a>
</header>

<main class="flex-1 flex items-center justify-center p-8 relative z-10">
    <div class="glass-premium rounded-[48px] w-full max-w-lg p-12 lg:p-16 space-y-16">
        <div class="flex gap-12 relative border-b border-black/5">
            <button id="tab-login-btn" class="relative py-5 text-[11px] uppercase tracking-[0.3em] font-bold text-ink" onclick="switchTab('login')">Log In</button>
            <button id="tab-signup-btn" class="relative py-5 text-[11px] uppercase tracking-[0.3em] font-bold text-gray-300" onclick="switchTab('signup')">Register</button>
            <div id="active-line" class="absolute bottom-0 left-0 w-16 h-[2px] bg-rose transition-all duration-500"></div>
        </div>

        <!-- Login -->
        <div id="panel-login" class="space-y-12 animate-fadeUp">
            <div class="space-y-4">
                <h1 class="font-serif text-5xl italic tracking-tight">Welcome <span class="text-rose">Back.</span></h1>
                <p class="text-sm font-light text-ink-light">Bắt đầu hành trình tinh khiết của riêng bạn.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-10">
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 ml-1">Email Identifier</label>
                    <input id="login-email" type="email" required placeholder="your@email.com" autocomplete="email" class="input-premium" />
                    <p id="login-email-error" class="error-msg hidden text-[10px] text-red-500 font-bold uppercase tracking-[0.2em] ml-1 animate-fadeUp"></p>
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">Security Key</label>
                        <button type="button" onclick="togglePw('login-pw')" class="text-[9px] font-bold uppercase tracking-[0.2em] text-rose">Show</button>
                    </div>
                    <input id="login-pw" type="password" required placeholder="••••••••" autocomplete="current-password" class="input-premium" />
                    <p id="login-pw-error" class="error-msg hidden text-[10px] text-red-500 font-bold uppercase tracking-widest ml-1 animate-fadeUp"></p>
                </div>
                <!-- Intentional CTA (Point 2) -->
                <button type="submit" class="btn-cta w-full shadow-premium">ĐĂNG NHẬP NGAY</button>
            </form>
        </div>

        <!-- Signup -->
        <div id="panel-signup" class="hidden space-y-12 animate-fadeUp">
            <div class="space-y-4">
                <h1 class="font-serif text-5xl italic tracking-tight">Join the <span class="text-mint">Farm.</span></h1>
                <p class="text-sm font-light text-ink-light">Trở thành một phần của cộng đồng sống xanh.</p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-8">
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 ml-1">Full Name</label>
                    <input id="reg-name" type="text" required placeholder="Họ và tên của bạn" class="input-premium" />
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 ml-1">Email Address</label>
                    <input id="reg-email" type="email" required placeholder="your@email.com" class="input-premium" />
                    <p id="reg-email-error" class="error-msg hidden text-[10px] text-red-500 font-bold uppercase tracking-[0.2em] ml-1"></p>
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 ml-1">Password</label>
                    <input id="reg-pw" type="password" required placeholder="Tối thiểu 6 ký tự" minlength="6" class="input-premium" />
                </div>
                <button type="submit" class="btn-cta w-full !bg-mint hover:!bg-mint-dark">BẮT ĐẦU HÀNH TRÌNH</button>
            </form>
        </div>

    </div>
</main>

<script>
    renderFooter();
    if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
